<div class="login-container">
    <mat-card class="login-card">
        <mat-card-title>LOG-IN PAGE</mat-card-title>

        <div *ngIf="loginError" class="alert">
            Oops! Something went wrong.<br>Incorrect login details.
        </div>

            <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onLogin()">

                <mat-form-field class="full-width">

                <mat-label>Email:</mat-label>
                <input type="email" matInput 
                formControlName="username"
                placeholder="Ex. example@gmail.com">

                <mat-error *ngIf="email?.hasError('required')">
                    Email is required.</mat-error>  
            <mat-error *ngIf="email?.hasError('email')">
                Please enter a valid email address. </mat-error>

                </mat-form-field>

                <mat-form-field class="full-width">

            <mat-label>Password:</mat-label>
                <input type="password" matInput 
                formControlName="password"
                placeholder="********">

                <mat-error *ngIf="password?.hasError('required')">
                    Password is required. </mat-error>   
            <mat-error *ngIf="password?.hasError('minlength')">
                Must be at least 8 characters long. </mat-error>    

        </mat-form-field> 

            <button mat-stroke-button color="primary" class="full-width custom-login-btn"
            type="submit" [disabled]="loginForm.invalid">Login</button>

            </form>
            </mat-card>
